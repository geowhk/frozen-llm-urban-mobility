[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seoul-flow-representation-study"
version = "0.1.0"
description = "Reproducible methods for a frozen-LLM urban flow evaluation"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[project.scripts]
urban_mobility = "urban_mobility.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]
